<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента бенчмарков</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body class="feed-page">
    <div class="video-container">
        <video src="{{.Benchmark.VideoKey}}" autoplay muted loop playsinline></video>
        <div class="video-overlay">
            <div class="video-left">
                <h2>{{.Benchmark.AlgoName}}</h2>
                <p class="complexity">{{.Benchmark.Complexity}}</p>
                <p class="description">{{.Benchmark.Description}}</p>
            </div>
            <div class="video-right">
                <div class="params">
                    <span>N: {{.Benchmark.InputSize}}</span>
                    <span>⏱️ {{.Benchmark.ExecTimeMs}} мс</span>
                </div>
                <div class="actions">
                    <div class="like-btn">❤️ {{len .Benchmark.Likes}}</div>
                    <a href="/feed?id={{.Benchmark.BenchmarkID}}&next=true" class="next-btn">↓</a>
                </div>
            </div>
        </div>
    </div>
    <nav class="bottom-nav">
        <a href="/feed" class="nav-item active"><img src="/static/feed.svg" class="nav-icon"></a>
        <a href="/add" class="nav-item"><img src="/static/add.svg" class="nav-icon"></a>
        <a href="/grid" class="nav-item"><img src="/static/grid.svg" class="nav-icon"></a>
    </nav>
</body>
</html>
