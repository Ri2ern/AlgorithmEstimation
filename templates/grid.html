<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плитка бенчмарков</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body class="grid-page">
    <div class="grid-header">
        <h2>Бенчмарки алгоритмов</h2>
        <form method="GET" action="/grid" class="filter-form">
            <div class="range-inputs">
                <input type="number" name="filter_min" value="{{.FilterMin}}" placeholder="От">
                <span>—</span>
                <input type="number" name="filter_max" value="{{.FilterMax}}" placeholder="До">
            </div>
            <button type="submit" class="filter-btn">
                <img src="/static/filter.svg" class="filter-icon">
            </button>
        </form>
    </div>
    <div class="cards-grid">
        {{range .Benchmarks}}
        <div class="card">
            <a href="/feed?id={{.ID}}">
                {{if .ImageURL}}
                    <img src="{{.ImageURL}}" alt="{{.Name}}" onerror="this.src='/static/default.png'">
                {{else}}
                    <img src="/static/default.png" alt="{{.Name}}">
                {{end}}
                <div class="card-info">
                    <h3>{{.Name}}</h3>
                    <p class="complexity">{{.Status}}</p>
                    <p class="stats">N: {{.InputSize}} | ⏱️ {{.ExecTimeMs}} мс</p>
                    <p class="likes">❤️ {{len .Likes}}</p>
                </div>
            </a>
            <form method="POST" action="/delete" style="margin: 0; padding: 8px 12px; border-top: 1px solid #1E293B;">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit" style="width: 100%; background: #EF4444; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.background='#DC2626'" onmouseout="this.style.background='#EF4444'">
                    🗑️ Удалить
                </button>
            </form>
        </div>
        {{end}}
    </div>
    <nav class="bottom-nav">
        <a href="/feed" class="nav-item"><img src="/static/feed.svg" class="nav-icon"></a>
        <a href="/add" class="nav-item"><img src="/static/add.svg" class="nav-icon"></a>
        <a href="/grid" class="nav-item active"><img src="/static/grid.svg" class="nav-icon"></a>
    </nav>
</body>
</html>
